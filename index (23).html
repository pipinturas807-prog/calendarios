        // Extraer formato "HH:MM - HH:MM" de los strings oficiales
        const extractTime = (desc) => {
            if (!desc) return '';
            const match = desc.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/);
            return match ? match[0] : '';
        };

        // Formatear tiempos para los inputs type="time"
        const padTime = (t) => {
            if (!t) return '';
            const parts = t.split(':');
            if (parts.length === 2) {
                return `${parts[0].padStart(2, '0')}:${parts[1]}`;
            }
            return t;
        };

        const parseTimeRange = (timeStr) => {
            if (!timeStr) return { from: '', to: '' };
            const parts = timeStr.split('-');
            if (parts.length === 2) {
                return {
                    from: padTime(parts[0].trim()),
                    to: padTime(parts[1].trim())
                };
            }
            return { from: '', to: '' };
        };

        // Calcular la duración en horas de un turno concreto
        const calculateShiftHours = (shiftObj) => {
            if (!shiftObj || !shiftObj.code || ['D', 'V', 'B'].includes(shiftObj.code)) return 0;
            const timeStr = shiftObj.time || extractTime(TURNOS_COMPLETOS_OFICIALES[shiftObj.code]);
            if (!timeStr) return 0;
            const { from, to } = parseTimeRange(timeStr);
            if (!from || !to) return 0;
            
            const [h1, m1] = from.split(':').map(Number);
            const [h2, m2] = to.split(':').map(Number);
            if (isNaN(h1) || isNaN(m1) || isNaN(h2) || isNaN(m2)) return 0;
            
            let startMin = h1 * 60 + m1;
            let endMin = h2 * 60 + m2;
            if (endMin <= startMin) {
                endMin += 24 * 60; // Caso de turno nocturno
            }
            return (endMin - startMin) / 60;
        };

        // Calcular acumulados de horas (mensuales y semanales) y contadores de días especiales (D, V, B)
        const calculateEmployeeStats = (empShifts, weekdays) => {
            let totalMonthHours = 0;
            let countD = 0;
            let countV = 0;
            let countB = 0;
            const weeklyHours = [];
            let currentWeekHours = 0;

            empShifts.forEach((shiftObj, idx) => {
                const code = shiftObj?.code || '';
                if (code === 'D') countD++;
                else if (code === 'V') countV++;
                else if (code === 'B') countB++;

                const hrs = calculateShiftHours(shiftObj);
                totalMonthHours += hrs;

                const wd = weekdays[idx] || '';
                if (wd === 'L' && idx > 0) {
                    weeklyHours.push(currentWeekHours);
                    currentWeekHours = 0;
                }
                currentWeekHours += hrs;
            });
            weeklyHours.push(currentWeekHours);

            return {
                totalMonthHours,
                weeklyHours,
                countD,
                countV,
                countB
            };
        };

        const initialMap = (shiftsArray) => shiftsArray.map(code => ({
            code,
            time: extractTime(TURNOS_COMPLETOS_OFICIALES[code]),

        }));

              }
            ]
          }

        const parseCSV = (csvText, category) => {
          const lines = csvText.split('\n').map(l => l.split(','));
          const monthlySchedules = [];
          let globalLegend = { ...TURNOS_COMPLETOS_OFICIALES };

          for (let i = 0; i < lines.length; i++) {
            if (lines[i][1] === '1' && lines[i][2] === '2') {
              const daysRowIdx = i;
              let monthName = "MES DESCONOCIDO";
              
              const possibleMonth = lines[i].find(cell => cell && isNaN(parseInt(cell)) && cell.trim() !== '');
              if (possibleMonth) monthName = possibleMonth.trim();

              const weekdays = lines[daysRowIdx + 1].slice(1, 32).map(w => w ? w.trim() : '');
              const employees = [];

              let empIdx = daysRowIdx + 2;
              while (empIdx < lines.length && lines[empIdx] && lines[empIdx][0] && lines[empIdx][0].trim() !== '') {
                const name = lines[empIdx][0].trim();
                const shifts = lines[empIdx].slice(1, 32).map(s => {
                    const code = s ? s.trim() : '';
                    return {
                        code,
                        time: extractTime(TURNOS_COMPLETOS_OFICIALES[code]),
                        isModified: false
                    };
                });
                
                if (name.length > 2 && !name.includes('DIA') && !name.includes('MAÑANA') && !name.includes('H.NO')) {
                  if (!employees.some(e => e.name === name)) {
                    employees.push({ name, shifts });
                  }
                }
                empIdx++;
              }

              if (employees.length > 0) {
                monthlySchedules.push({
                  id: `${Date.now()}-${monthName}-${Math.random()}`,
                  category,
                  monthName,
                  weekdays,
                  employees,
                  legend: globalLegend
                });
              }
            }
          }

          return monthlySchedules;
        };

        function getShiftBadgeStyle(shiftCode) {
          if (!shiftCode || shiftCode === 'D') return 'bg-red-500 text-white border border-black dark:border-white';
          if (shiftCode === 'V') return 'bg-blue-800 text-white border border-black dark:border-white';
          if (shiftCode === 'B') return 'bg-slate-500 text-white border border-black dark:border-white';
          if (shiftCode.startsWith('M')) return 'bg-green-400 text-black font-black border border-black';
          if (shiftCode.startsWith('T')) return 'bg-yellow-300 text-black font-black border border-black';
          if (shiftCode.startsWith('P')) return 'bg-cyan-400 text-black font-black border border-black';
          if (shiftCode.startsWith('N')) return 'bg-purple-600 text-white border border-black dark:border-white';
          return 'bg-gray-200 text-black border border-black';

        function App() {
          const [currentView, setCurrentView] = useState('login'); 
          const [schedules, setSchedules] = useState(DATOS_INICIALES);
          const [selectedCategory, setSelectedCategory] = useState('');
          const [selectedEmployeeName, setSelectedEmployeeName] = useState('');
          const [selectedMonth, setSelectedMonth] = useState('');
          const [notifications, setNotifications] = useState({}); 
          const [employeePasswords, setEmployeePasswords] = useState({});
          const [darkMode, setDarkMode] = useState(false);
          const [cloudReady, setCloudReady] = useState(false);
          const [cloudError, setCloudError] = useState('');
          const dataLoadedRef = useRef(false);
          const isRemoteUpdateRef = useRef(false);

          // 1) Autenticación anónima + suscripción en tiempo real al documento compartido
          useEffect(() => {
            let unsubscribeSnapshot = null;

            signInAnonymously(auth).catch((err) => {
              console.error('Error de autenticación Firebase:', err);
              setCloudError('No se pudo conectar con la base de datos.');
            });

            const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
              if (!user) return;
              unsubscribeSnapshot = onSnapshot(ESTADO_DOC_REF, (snap) => {
                isRemoteUpdateRef.current = true;
                if (snap.exists()) {
                  const data = snap.data();
                  setSchedules(data.schedules && data.schedules.length ? data.schedules : DATOS_INICIALES);
                  setNotifications(data.notifications || {});
                  setEmployeePasswords(data.employeePasswords || {});
                } else {
                  setDoc(ESTADO_DOC_REF, { schedules: DATOS_INICIALES, notifications: {}, employeePasswords: {} });
                }
                dataLoadedRef.current = true;
                setCloudReady(true);
              }, (err) => {
                console.error('Error leyendo Firestore:', err);
                setCloudError('No se pudo sincronizar con la nube.');
              });
            });

            return () => {
              unsubscribeAuth();
              if (unsubscribeSnapshot) unsubscribeSnapshot();
            };
          }, []);

          // 2) Cada cambio local (subidas, ediciones, notificaciones, contraseñas) se guarda en Firestore
          useEffect(() => {
            if (!dataLoadedRef.current) return;

        function AdminPortal({ schedules, setSchedules, employeePasswords, setEmployeePasswords, onBack, darkMode, toggleDarkMode, themeClasses, cardClasses, selectClasses }) {

          const [file, setFile] = useState(null);
          const [error, setError] = useState('');
          const [success, setSuccess] = useState('');
          const [expandedScheduleId, setExpandedScheduleId] = useState(null);
          const [resetEmpName, setResetEmpName] = useState('');
          const [newEmpPass, setNewEmpPass] = useState('');

          const fileInputRef = useRef(null);

          const handleFileUpload = (e) => {
            const uploadedFile = e.target.files[0];
            if (uploadedFile) {
              setFile(uploadedFile);
              setError('');
              setSuccess('');
            }
          };

          const processFile = async () => {
            if (!file) return;
            setError('');
            setSuccess('Procesando archivo...');
            
            try {
              let text = '';
              const isExcel = file.name.toLowerCase().endsWith('.xlsx') || file.name.toLowerCase().endsWith('.xls');

              if (isExcel) {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                text = XLSX.utils.sheet_to_csv(worksheet);
              } else {
                text = await new Promise((resolve, reject) => {
                  const reader = new FileReader();
                  reader.onload = (e) => resolve(e.target.result);
                  reader.onerror = reject;
                  reader.readAsText(file, 'ISO-8859-1');
                });
              }

              const newMonthsArray = parseCSV(text, selectedCategory);
              
              setSchedules(prev => {
                let updated = [...prev];
                newMonthsArray.forEach(newSch => {
                  const existingIdx = updated.findIndex(s => s.category === newSch.category && s.monthName === newSch.monthName);
                  if (existingIdx !== -1) {
                    const existingEmpMap = new Map(updated[existingIdx].employees.map(e => [e.name, e]));
                    newSch.employees.forEach(emp => existingEmpMap.set(emp.name, emp));
                    updated[existingIdx] = {
                      ...updated[existingIdx],
                      employees: Array.from(existingEmpMap.values())
                    };
                  } else {
                    updated.push(newSch);
                  }
                });
                return updated;
              });
              
              setSuccess(`¡Cuadrante procesado correctamente! Trabajadores añadidos a ${selectedCategory}.`);
              setFile(null);
              if (fileInputRef.current) fileInputRef.current.value = '';
            } catch (err) {
              console.error(err);
              setError('Error al procesar el archivo. Asegúrate de que mantiene el formato original.');
              setSuccess('');
            }
          };

          const handleDeleteSchedule = (id) => {
            setSchedules(prev => prev.filter(s => s.id !== id));
          };

          const handleDeleteEmployee = (scheduleId, employeeName) => {
            setSchedules(prev => prev.map(sch => {
              if (sch.id === scheduleId) {
                return {
                  ...sch,
                  employees: sch.employees.filter(emp => emp.name !== employeeName)
                };
              }
              return sch;
            }));
          };

          const allEmployees = [...new Set(schedules.flatMap(s => s.employees.map(e => e.name)))];

          const handleResetPassword = (e) => {
            e.preventDefault();
            if (!resetEmpName) return;
            setEmployeePasswords(prev => ({
              ...prev,
              [resetEmpName]: newEmpPass
            }));
            setResetMsg(`¡Contraseña actualizada para ${resetEmpName}!`);
            setResetEmpName('');
            setNewEmpPass('');
            setTimeout(() => setResetMsg(''), 4000);
          };

          return h('div', { className: `min-h-screen ${themeClasses} flex flex-col transition-colors` },

                  })
                ),
                h('div', { className: 'flex-1 lg:max-w-md' },
                  h('div', { className: `${cardClasses} p-4 sm:p-5 lg:sticky lg:top-36` },
                    h('h3', { className: 'text-base sm:text-lg font-black uppercase mb-1 text-center border-b-2 border-current pb-2' }, `Calendario — ${schedule.monthName}`),
                    h('p', { className: 'text-[10px] font-black uppercase text-[#E30613] text-center mb-4' }, '💡 Toca un día para ir a su detalle'),
                    h('div', { className: 'grid grid-cols-7 gap-1 text-center mb-2' },
                      ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((d, i) => h('div', { key: d, className: `font-black text-xs ${i >= 5 ? 'text-[#E30613]' : ''}` }, d))
                    ),
                    h('div', { className: 'grid grid-cols-7 gap-1.5' },
                      emptyCells.map((_, i) => h('div', { key: `empty-${i}`, className: 'p-1' })),
                      employee.shifts.map((shiftObj, idx) => {
                        if (!shiftObj || !shiftObj.code) return null;
                        const dayNum = idx + 1;
                        const weekdayCode = schedule.weekdays[idx] || '';
                        const style = getShiftBadgeStyle(shiftObj.code);
                        const isWeekend = weekdayCode === 'S' || weekdayCode === 'D';
                        const isMod = shiftObj.isModified;
                        const isSelected = selectedDay === dayNum;
                        
                        const tooltipTime = shiftObj.time ? ` (${shiftObj.time})` : '';
                        const titleText = `${legendObj[shiftObj.code] || shiftObj.code}${tooltipTime}`;

                        return h('button', { 
                          key: dayNum, 
                          type: 'button',
                          title: titleText,
                          onClick: () => handleDayClick(dayNum),
                          className: `flex flex-col items-center justify-center p-1.5 border-2 border-current cursor-pointer hover:scale-105 active:scale-95 transition-all relative ${style} ${isWeekend ? 'ring-1 ring-current' : ''} ${isSelected ? 'ring-4 ring-[#E30613] z-10 scale-105' : ''}`,
                          style: { minHeight: '3rem', touchAction: 'manipulation' }
                        },
                          isMod && h('span', { className: 'absolute top-0.5 right-0.5 w-1.5 h-1.5 bg-[#E30613] border border-white rounded-full animate-pulse' }),
                          h('span', { className: 'text-[9px] sm:text-[10px] font-black w-full text-left leading-none opacity-80' }, dayNum),
                          h('span', { className: 'text-[11px] sm:text-xs font-black mt-auto text-center leading-tight tracking-tighter' }, shiftObj.code === 'D' ? 'LIB' : shiftObj.code)
                        );
                      })
                    ),
                    h('div', { className: 'mt-6 pt-4 border-t-2 border-current flex flex-wrap gap-2 sm:gap-3 text-xs font-black uppercase justify-center' },
                      h('span', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 bg-red-500 border border-current' }), ' Libre'),
                      h('span', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 bg-green-400 border border-current' }), ' Mañana'),
                      h('span', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 bg-yellow-300 border border-current' }), ' Tarde'),
                      h('span', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 bg-cyan-400 border border-current' }), ' Partido'),
                      h('span', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 bg-purple-600 border border-current' }), ' Noche'),
                      h('span', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 bg-blue-800 border border-current' }), ' Vacaciones'),
                      h('span', { className: 'flex items-center gap-1' }, h('div', { className: 'w-3 h-3 bg-slate-400 border border-current' }), ' Baja')
                    )
                  )
                )
              )
            );
          }

          return null;
        }

        ReactDOM.render(h(App), document.getElementById('root'));
    </script>
</body>
</html>
